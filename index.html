<!-- 웹게임 공개 배포 첫 화면 — 게임 목록만 담는다(아트·외부 의존성 없음) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>손겜 — 짧게 한 판</title>
<meta name="description" content="설치 없이 브라우저에서 바로 하는 퍼즐 게임. 한칸만더 · 째깍벨트.">
<style>
  :root { --bg:#14161c; --panel:#1c1f27; --line:#2a2e39; --text:#e8eaf0; --dim:#97a0b5; --accent:#f0b429; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 16px 40px;
    background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "맑은 고딕", system-ui, -apple-system, sans-serif;
    line-height: 1.6; word-break: keep-all;
    max-width: 560px; margin-inline: auto;
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; letter-spacing: .1em; }
  .sub { margin: 0 0 22px; color: var(--dim); font-size: .82rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.card {
    display: block; padding: 16px 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    color: inherit; text-decoration: none;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  .name { font-size: 1.1rem; font-weight: 700; }
  .name .tag { margin-left: 8px; font-size: .68rem; font-weight: 400; color: var(--accent); letter-spacing: .06em; }
  .desc { margin: 4px 0 0; font-size: .8rem; color: var(--dim); }
  footer { margin-top: 26px; font-size: .72rem; color: var(--dim); }
</style>
</head>
<body>
  <h1>손겜</h1>
  <p class="sub">설치 없이 바로 하는 퍼즐. 기록은 이 브라우저에 남습니다.</p>

  <ul>
    <li>
      <a class="card" href="merge-mine.html">
        <span class="name">한칸만더 <span class="tag">긴 판 · 성장</span></span>
        <p class="desc">붙은 광석을 합쳐 등급을 올립니다. 늘리는 건 채굴뿐이라, 한 칸만 더 캐다가 자리가 없어집니다.</p>
      </a>
    </li>
    <li>
      <a class="card" href="queue-line.html">
        <span class="name">째깍벨트 <span class="tag">짧은 판 · 한손</span></span>
        <p class="desc">벨트로 흘러오는 도형을 집어 선반에 모읍니다. 집어야 살고, 집으면 선반이 찹니다.</p>
      </a>
    </li>
  </ul>

  <footer>세로 화면·한손 조작 기준으로 만들었습니다.</footer>
</body>
</html>
